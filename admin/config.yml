backend:
  name: git-gateway
  branch: main # Oder 'master', je nach deinem Repository

media_folder: "images/assets"
public_folder: "/images/assets"

collections:
  - name: "pages"
    label: "Seiten"
    files:
      - file: "inhalt.json" # ← Hier speichert das CMS alle Texte und Bilder ab
        label: "Startseite Inhalte"
        name: "index"
        fields:
          # ── HERO ABSCHNITT ──
          - label: "Hero Bereich"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Hintergrundbild", name: "image", widget: "image" }
              - { label: "Kicker Text (DE)", name: "kicker_de", widget: "string" }
              - { label: "Kicker Text (EN)", name: "kicker_en", widget: "string" }
              - { label: "Hauptüberschrift (Titel)", name: "title", widget: "string" }
              - { label: "Untertext (DE)", name: "sub_de", widget: "text" }
              - { label: "Untertext (EN)", name: "sub_en", widget: "text" }

          # ── ÜBER MICH ABSCHNITT ──
          - label: "Über mich"
            name: "about"
            widget: "object"
            fields:
              - { label: "Foto", name: "image", widget: "image" }
              - { label: "Überschrift (DE)", name: "title_de", widget: "string" }
              - { label: "Überschrift (EN)", name: "title_en", widget: "string" }
              - { label: "Text Block 1 (DE)", name: "p1_de", widget: "text" }
              - { label: "Text Block 1 (EN)", name: "p1_en", widget: "text" }
              - { label: "Text Block 2 (DE)", name: "p2_de", widget: "text" }
              - { label: "Text Block 2 (EN)", name: "p2_en", widget: "text" }
