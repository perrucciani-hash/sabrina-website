backend:
  name: git-gateway
  branch: main

media_folder: "images/assets"
public_folder: "/images/assets"

collections:
  - name: "seiten"
    label: "Seiteninhalte"
    files:
      - label: "Hauptinhalte"
        name: "startseite"
        file: "inhalt.json"
        fields:
          # Hero
          - {label: "Hero", name: "hero", widget: "object", fields: [
              {label: "Bild", name: "image", widget: "image"},
              {label: "Titel", name: "title", widget: "string"},
              {label: "Kicker (DE)", name: "kicker_de", widget: "string"},
              {label: "Untertitel (DE)", name: "sub_de", widget: "text"}
            ]}
          
          # Über mich
          - {label: "Über mich", name: "about", widget: "object", fields: [
              {label: "Bild", name: "image", widget: "image"},
              {label: "Titel (DE)", name: "title_de", widget: "string"},
              {label: "Text 1 (DE)", name: "p1_de", widget: "text"}
            ]}

          # Referenzen (als Liste)
          - label: "Referenzen"
            name: "referenzen"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Rolle", name: "rolle", widget: "string"}

          # Preise (als Liste)
          - label: "Preis-Pakete"
            name: "preise"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Betrag", name: "betrag", widget: "number"}
              - {label: "Leistungen (kommasepariert)", name: "leistungen", widget: "text"}
