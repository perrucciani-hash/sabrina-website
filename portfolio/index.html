<script>
var PAGE_META = {
  de: { title: 'Portfolio — Portraits & Business | Sabrina Fiechter Photography', desc: 'Portfolio von Sabrina Fiechter — Portraitfotografin in Zürich. Bewerbungsfotos, Business Portraits, kreative Portraits und Auftragsarbeiten.', lang: 'de' },
  en: { title: 'Portfolio — Portraits & Business | Sabrina Fiechter Photography', desc: 'Portfolio of Sabrina Fiechter — portrait photographer in Zurich. Application photos, business portraits, creative portraits and commissioned work.', lang: 'en' }
};
</script>

<script>
var sfLang = localStorage.getItem('sf_lang') || 'de';
function applyLang(l) {
  document.querySelectorAll('[data-de]').forEach(function(el) {
    el.innerHTML = l === 'en' ? (el.getAttribute('data-en') || el.getAttribute('data-de')) : el.getAttribute('data-de');
  });
  var meta = PAGE_META[l] || PAGE_META.de;
  document.getElementById('page-title').textContent = meta.title;
  document.getElementById('page-desc').setAttribute('content', meta.desc);
  document.getElementById('html-root').setAttribute('lang', meta.lang);
}
function setLang(l) {
  sfLang = l; localStorage.setItem('sf_lang', l);
  var btnDE = document.getElementById('btnDE'), btnEN = document.getElementById('btnEN');
  if (btnDE) btnDE.classList.toggle('active', l === 'de');
  if (btnEN) btnEN.classList.toggle('active', l === 'en');
  applyLang(l);
}

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#1a1a1a;--text:#333333;--grey:#6b6b6b;--accent:#1f7a72;--line:#e6e6e6;--bg:#ffffff;--bg-soft:#f6f5f3}
html{scroll-behavior:smooth}
body{font-family:'Manrope',sans-serif;color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}

/* PAGE HEADER */
.page-header{padding:8rem 2.5rem 3.5rem;background:var(--bg-soft);border-bottom:1px solid var(--line)}
.page-header-inner{max-width:1200px;margin:0 auto}
.eyebrow{font-family:'Jost';font-size:.82rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;display:block}
.page-header h1{font-family:'Jost';font-size:clamp(2.2rem,4vw,3rem);font-weight:300;color:var(--black)}

/* FILTER BAR */
.filter-wrap{position:sticky;top:79px;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);padding:.9rem 2.5rem}
.filter-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.fbtn{
  font-family:'Jost';font-size:.82rem;font-weight:500;letter-spacing:.06em;
  padding:.45rem 1.1rem;border-radius:2px;border:1.5px solid var(--line);
  background:transparent;color:var(--grey);cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.fbtn:hover{border-color:var(--black);color:var(--black)}
.fbtn.active{background:var(--black);color:#fff;border-color:var(--black)}

/* GALLERY */
.gallery-wrap{max-width:1200px;margin:0 auto;padding:2.5rem 2.5rem 6rem}
.gallery{
  columns:3;
  column-gap:12px;
}
.gitem{
  break-inside:avoid;
  margin-bottom:12px;
  display:block;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition:opacity .35s, transform .35s;
}
.gitem.hidden{
  display:none;
}
.gitem img{
  width:100%;height:auto;display:block;
  transition:transform .5s ease;
}
.gitem:hover img{transform:scale(1.03)}

/* Placeholder (solange keine echten Bilder) */
.ph{
  width:100%;background:var(--bg-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.5rem;
  transition:transform .5s ease;
}
.gitem:hover .ph{transform:scale(1.03)}
.ph-icon{
  width:36px;height:36px;stroke:var(--line);fill:none;stroke-width:1;
}
.ph-cat{
  font-family:'Jost';font-size:.72rem;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--line);
}

/* Overlay auf Hover */
.gitem-overlay{
  position:absolute;inset:0;background:rgba(26,26,26,0);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
  padding:1.2rem;transition:background .35s;
  pointer-events:none;
}
.gitem:hover .gitem-overlay{background:rgba(26,26,26,.3)}
.gitem-label{
  font-family:'Jost';font-size:.78rem;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:#fff;opacity:0;
  transform:translateY(6px);transition:opacity .3s,transform .3s;
}
.gitem:hover .gitem-label{opacity:1;transform:translateY(0)}

/* Leermeldung wenn Filter keine Treffer */
.gallery-empty{display:none;text-align:center;padding:5rem 0;color:var(--grey);font-size:1rem;columns:unset}
.gallery-empty.visible{display:block}

@media(max-width:900px){
  .gallery{columns:2}
  .filter-wrap{padding:.9rem 1.3rem}
  .gallery-wrap{padding:2rem 1.3rem 5rem}
}
@media(max-width:560px){
  .gallery{columns:1}
  .page-header{padding:6rem 1.3rem 2.5rem}
  .filter-inner{gap:.4rem}
  .fbtn{font-size:.75rem;padding:.4rem .85rem}
}

/* FOOTER */
footer{background:#111;color:#fff;padding:3.5rem 2.5rem 2.5rem}
.foot-grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:2.5rem}
.foot-tag{font-size:.95rem;color:rgba(255,255,255,.55);line-height:1.7}
.foot-ct{font-family:'Jost';font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:1rem}
.foot-links{list-style:none;display:flex;flex-direction:column;gap:.55rem}
.foot-links a{font-size:.96rem;color:rgba(255,255,255,.85);text-decoration:none;transition:color .2s}
.foot-links a:hover{color:var(--accent)}
.foot-copy{max-width:1280px;margin:2.5rem auto 0;padding-top:2rem;border-top:1px solid rgba(255,255,255,.1);font-size:.82rem;color:rgba(255,255,255,.35)}
@media(max-width:920px){.foot-grid{grid-template-columns:1fr 1fr;gap:2rem}}
@media(max-width:560px){.foot-grid{grid-template-columns:1fr;gap:2rem}}
</style>

<script>
var sfLangInit = localStorage.getItem('sf_lang') || 'de';
document.addEventListener('DOMContentLoaded', function() {
  var btnDE = document.getElementById('btnDE'), btnEN = document.getElementById('btnEN');
  if (btnDE) btnDE.classList.toggle('active', sfLangInit === 'de');
  if (btnEN) btnEN.classList.toggle('active', sfLangInit === 'en');
  applyLang(sfLangInit);
});

/* Filter */
document.querySelectorAll('.fbtn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var filter = this.getAttribute('data-filter');
    document.querySelectorAll('.fbtn').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    var items = document.querySelectorAll('.gitem');
    var visible = 0;
    items.forEach(function(item) {
      if (filter === 'all' || item.getAttribute('data-cat') === filter) {
        item.classList.remove('hidden');
        visible++;
      } else {
        item.classList.add('hidden');
      }
    });
    var empty = document.getElementById('gallery-empty');
    empty && empty.classList.toggle('visible', visible === 0);
  });
});

/* Partials */
(function(){
  function load(id, file){
    var el = document.getElementById(id);
    if (!el) return;
    fetch(file).then(function(r){ return r.text(); }).then(function(h){
      el.outerHTML = h;
      applyLang(sfLangInit);
    });
  }
  load('nav-placeholder', '/navbar.html');
  load('footer-placeholder', '/footer.html');
  load('modal-placeholder', '/modal.html');
})();

if (window.netlifyIdentity) {
  window.netlifyIdentity.on('init', function(user) {
    if (!user) { window.netlifyIdentity.on('login', function() { document.location.href = '/admin/'; }); }
  });
}
</script>
