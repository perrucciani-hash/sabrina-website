<!DOCTYPE html>
<html lang="de" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden | Sabrina Fiechter Photography</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--black:#1a1a1a;--text:#333333;--grey:#6b6b6b;--accent:#1f7a72;--line:#e6e6e6;--bg:#ffffff;--bg-soft:#f6f5f3}
body{font-family:'Manrope',sans-serif;color:var(--text);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:5rem 2rem;text-align:center}
.wrap{max-width:480px}
.code{font-family:'Jost';font-size:6rem;font-weight:300;color:var(--line);line-height:1;margin-bottom:1.5rem}
.eyebrow{font-family:'Jost';font-size:.8rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;display:block}
h1{font-family:'Jost';font-size:1.8rem;font-weight:300;color:var(--black);margin-bottom:1rem}
p{font-size:1rem;color:var(--grey);line-height:1.7;margin-bottom:2rem}
.links{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:'Jost';font-size:.95rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;width:220px;padding:.75rem 0;border-radius:2px;border:1.5px solid;text-decoration:none;white-space:nowrap;transition:background .3s,color .3s,border-color .3s}
.btn-primary{background:var(--black);color:#fff;border-color:var(--black)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent)}
.btn-secondary{background:transparent;color:var(--black);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<div id="nav-placeholder"></div>

<main>
  <div class="wrap">
    <div class="code">404</div>
    <span class="eyebrow">Seite nicht gefunden</span>
    <h1>Diese Seite existiert nicht</h1>
    <p>Die gesuchte Seite wurde möglicherweise verschoben oder gelöscht. Schau dich gerne auf der Startseite um.</p>
    <div class="links">
      <a href="/" class="btn btn-primary">Zur Startseite</a>
      <a href="/kontakt/" class="btn btn-secondary">Kontakt</a>
    </div>
  </div>
</main>

<div id="footer-placeholder"></div>

<script>
var sfLang = localStorage.getItem('sf_lang') || 'de';
function applyLang(l){}
function setLang(l){ sfLang=l; localStorage.setItem('sf_lang',l); }
(function(){
  function load(id,file){
    var el=document.getElementById(id);
    if(!el)return;
    fetch(file).then(function(r){return r.text();}).then(function(h){ el.outerHTML=h; });
  }
  load('nav-placeholder','/navbar.html');
  load('footer-placeholder','/footer.html');
})();
</script>
</body>
</html>
